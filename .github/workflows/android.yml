name: Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already contain the Android SDK and cmdline tools.
      # setup-android@v3 attempted to install removed SDK package "tools".
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VexPixelStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish directly installable APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VexPixelStudio-v0.3.1-debug.apk
          if ! gh release view v0.3.1-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.3.1-debug --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "VEX Pixel Studio v0.3.1 (debug APK)" \
              --notes "Android build for offline Prompt32 and Prompt64. Install models within the app. Debug build; performance and inference on real phones are not yet certified." \
              --prerelease --latest=false
          fi
          gh release upload v0.3.1-debug VexPixelStudio-v0.3.1-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
